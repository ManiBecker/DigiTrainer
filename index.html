<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigiTrainer v0.64</title>
<link rel="stylesheet" href="css/digitrainer.css">
</head>
<body>
<main class="app">
<h1>DigiTrainer v0.64</h1>
<div id="visitor-counter">
  Besuche seit 26.10.2026:
  <span id="visitor-count">–</span>
</div>

<script>
fetch("https://digitrainer.goatcounter.com/counter//DigiTrainer.json")
  .then(response => response.json())
  .then(data => {
    document.getElementById("visitor-count").textContent =
      data.count;
  })
  .catch(error => console.error("Besucherzähler:", error));
</script>
<div class="toolbar">
  <button class="zoom-out" type="button" title="Verkleinern">−</button>
  <span class="zoom-value">100 %</span>
  <button class="zoom-in" type="button" title="Vergrößern">+</button>
  <button class="zoom-reset" type="button">Zurücksetzen</button>
  <button class="mode-toggle" type="button" aria-pressed="false">Mode: Wiring</button>
  <label class="debug-toggle" title="Pegelanzeige auf Kabeln und gelben Feldern"><input type="checkbox" id="debug-toggle"> Debug</label>
  <button class="help-toggle" type="button" aria-haspopup="dialog" aria-controls="help-dialog">Hilfe ?</button>
  <button class="fullscreen-toggle" type="button">Vollbild</button>
</div>
<button class="pseudo-fullscreen-exit" type="button" aria-label="Pseudo-Vollbild beenden">Vollbild beenden</button>
<div class="board-container">
  <div class="board-area">
    <img class="board" src="boards/itt-digitrainer2/board.jpg" alt="ITT Digi-Trainer 2" draggable="false">
    <svg class="wiring-layer"></svg>
    <div class="power-switch" title="Power ON/OFF"></div>
    <div class="power-led"></div>
  </div>
</div>
<div class="statusbar">
  <span class="status-message">Ready</span>
  <span class="coordinates">X: -- &nbsp; Y: --</span>
</div>
</main>
<dialog id="help-dialog" aria-labelledby="help-title">
  <div class="help-header">
    <strong id="help-title">DigiTrainer – Online-Hilfe</strong>
    <button type="button" id="help-close" aria-label="Hilfe schließen">✕</button>
  </div>
  <iframe class="help-frame" src="help.html" title="DigiTrainer Bedienungsanleitung"></iframe>
</dialog>
<script>
(() => {
  const dialog = document.getElementById('help-dialog');
  const open = document.querySelector('.help-toggle');
  const close = document.getElementById('help-close');
  open.addEventListener('click', () => dialog.showModal());
  close.addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
})();
</script>
<script src="js/simulator.js?v=64"></script>
<script src="js/projekt.js"></script>
<!-- GoatCounter Besucherstatistik -->
<script data-goatcounter="https://digitrainer.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
